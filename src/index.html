<!doctype html>

  <meta charset="utf-8">
  <title>National Medical Training College | NMTC</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="National Medical Training College (NMTC) trains competent, compassionate healthcare professionals through accredited diploma, certificate and short courses.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script>
    // Apply saved accessibility choices before the page draws, so text size or contrast never "jumps".
    // Keep the class names in sync with src/app/shared/accessibility.ts.
    try {
      var a11y = JSON.parse(localStorage.getItem('nmtc-accessibility') || '{}');
      var c = document.documentElement.classList;
      if (a11y.textSize) c.add('a11y-text-' + a11y.textSize);
      if (a11y.highContrast) c.add('a11y-contrast');
      if (a11y.highlightLinks) c.add('a11y-links');
      if (a11y.readableText) c.add('a11y-readable');
      if (a11y.stopAnimations) c.add('a11y-no-motion');
      if (a11y.largeCursor) c.add('a11y-cursor');
    } catch (e) {}
  </script>
  <style>
    /* Start-up screen shown until the site is ready (see the note next to it in <body>). */
    .boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2000;
      transition: opacity 0.35s, visibility 0.35s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: #0d4d30;
    }
    .boot-crest {
      position: relative;
      display: grid;
      place-items: center;
      width: 104px;
      height: 104px;
    }
    .boot-crest svg {
      width: 48px;
      height: 56px;
    }
    .boot-spinner {
      position: absolute;
      inset: 0;
      border: 3px solid #e9f4ee;
      border-top-color: #c9a227;
      border-radius: 50%;
      animation: boot-spin 0.9s linear infinite;
    }
    .boot-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    .boot-name {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
    /* No spinning for visitors who asked for less motion: show a still ring instead. */
    @media (prefers-reduced-motion: reduce) {
      .boot-spinner { animation: none; border-color: #c9a227; }
    }
    .a11y-no-motion .boot-spinner { animation: none; border-color: #c9a227; }
  </style>
</head>
<body>
  <app-root></app-root>
  <!-- Start-up screen: stays until the site has rendered AND its stylesheet has loaded
       (hidden by hideStartupScreen() in src/app/app.ts). -->
  <div class="boot-splash" role="status">
    <div class="boot-crest">
      <span class="boot-spinner" aria-hidden="true"></span>
      <svg viewBox="0 0 48 56" aria-hidden="true">
        <path d="M24 2 44 9v18c0 13-9 22-20 27C13 49 4 40 4 27V9Z" fill="#198754" stroke="#c9a227" stroke-width="3"/>
        <path d="M20 14h8v8h8v8h-8v12h-8V30h-8v-8h8Z" fill="#fff"/>
      </svg>
    </div>
    <p class="boot-name">Loading…</p>
  </div>
