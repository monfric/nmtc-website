<div class="scroll-progress" [style.transform]="'scaleX(' + progress() + ')'" aria-hidden="true"></div>

<button type="button" class="visually-hidden-focusable skip-link" (click)="main.focus()">Skip to main content</button>

<app-header />

<main #main id="main-content" tabindex="-1">
  <router-outlet />
</main>

<app-footer />

<button type="button" class="back-to-top" [class.is-visible]="showBackToTop()" (click)="scrollToTop()"
  aria-label="Back to top">
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <circle class="back-to-top-track" cx="24" cy="24" r="21" />
    <circle class="back-to-top-ring" cx="24" cy="24" r="21" [style.stroke-dashoffset]="132 - 132 * progress()" />
  </svg>
  <i class="bi bi-arrow-up" aria-hidden="true"></i>
</button>

<app-accessibility-panel />
